[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ampide"
version = "1.0.0"
description = "Adversarial Multi-Turn Prompt Injection Defense Environment"
authors = [
    { name="Harshini S" }
]
readme = "README.md"
requires-python = ">=3.10"

# ✅ dependencies MUST be HERE
dependencies = [
    "fastapi==0.115.5",
    "uvicorn[standard]==0.32.1",
    "pydantic==2.10.3",
    "openai>=2.7.2",
    "pyyaml==6.0.2",
    "python-dotenv==1.2.2",
    "openenv-core>=0.2.0"
]

# ✅ scripts ONLY contain entrypoints
[project.scripts]
server = "server.app:main"

[tool.setuptools]
py-modules = ["ampide_env", "tasks", "grader", "inference"]