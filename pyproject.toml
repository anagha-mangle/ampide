[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ampide"
version = "1.0.0"
description = "Adversarial Multi-Turn Prompt Injection Defense Environment"
authors = [
{ name="Harshini S" }
]
readme = "README.md"
requires-python = ">=3.8"

dependencies = [
"fastapi",
"uvicorn",
"pydantic",
]

[tool.setuptools]
py-modules = ["ampide_env", "tasks", "grader", "server"]
